<!doctype html><html><head><meta charset="utf-8"><title>Utility reset</title>
<style>
  *,::before,::after{box-sizing:border-box;border-width:0;border-style:solid}
  html{line-height:1.5;-webkit-text-size-adjust:100%;font-family:ui-sans-serif,system-ui}
  body{margin:0;line-height:inherit;background:#fff;color:#111}
  button{background-image:none;text-transform:none;font-family:inherit;font-size:100%;padding:0}
  :where(div,span,p,ul,li){margin:0;padding:0}
  ul{list-style:none}
</style></head><body>
  <h1>Utility-first reset</h1>
  <div><span>Was <s>$120.00</s></span><span>$79.00</span></div>

  <button id="checkout" style="position:fixed;right:32px;bottom:32px">Place order</button>
</body></html>

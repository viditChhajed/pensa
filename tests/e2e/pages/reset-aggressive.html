<!doctype html><html><head><meta charset="utf-8"><title>Aggressive reset</title>
<style>
  *, *::before, *::after { all: unset !important; box-sizing: border-box !important; }
  div, span, p, ul, li, button { display: block !important; font-family: "Comic Sans MS" !important;
    color: #ff00ff !important; background: #003300 !important; border: 3px dashed lime !important;
    font-size: 28px !important; letter-spacing: 4px !important; }
  body { margin: 0; padding: 40px; background: #111; }
</style></head><body>
  <h1 style="color:#fff">Aggressive global reset</h1>
  <div class="price"><del>$89.99</del> <span>$49.99</span> <span>45% off</span></div>
  <p>Only 3 left in stock</p>
  <button id="checkout" style="position:fixed;right:32px;bottom:32px">Place order</button>
</body></html>

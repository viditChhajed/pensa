name = "pensa-counts"
main = "worker.ts"
compatibility_date = "2026-01-01"

# No analytics engine binding, no logpush, no tail consumer. See DEPLOY.md: Cloudflare
# records the client IP in its own request logs by default, and an IP beside an hour bucket
# and a site category re-identifies a person. Disabling that is a dashboard step, not a
# config one, which is why it is a checklist item rather than a line here.

[[d1_databases]]
binding = "DB"
# The D1 database keeps the extension's first name (Vero): D1 cannot rename a database, and
# this one holds the dataset. Only the Worker, and so the endpoint URL, is named pensa.
database_name = "vero-counts"
database_id = "fe4bfcc1-e08e-4c5a-bf11-cc2369e83f5a"

[observability]
enabled = false
